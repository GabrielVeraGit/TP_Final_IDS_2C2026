{% extends "base.html" %}
{% block contenido %}
<h1>Ingresar</h1>
<form class="formulario" method="POST" action="{{ url_for('user_bp.login') }}">
    <input type="hidden" name="siguiente" value="{{ siguiente }}">
    <label>Email <input type="email" name="email" required></label>
    <label>Contrasenia <input type="password" name="password" required></label>
    <button type="submit">Ingresar</button>
</form>

{% endblock %}
