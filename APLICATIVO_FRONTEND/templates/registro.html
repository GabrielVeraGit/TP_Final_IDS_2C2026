{% extends "base.html" %}
{% block titulo %}Registro{% endblock %}
{% block contenido %}
<h1>Registrarse</h1>
<form class="formulario" method="POST" action="{{ url_for('user_bp.registro') }}">
    <label>Nombre <input type="text" name="nombre" required></label>
    <label>Apellido <input type="text" name="apellido" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Contrasenia <input type="password" name="password" required></label>
    <button type="submit">Crear cuenta</button>
</form>
<p class="chico">Dominios permitidos: gmail.com, yahoo.com, hotmail.com, fi.uba.ar</p>
{% endblock %}
